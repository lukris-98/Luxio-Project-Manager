<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0C0E" />
    <meta name="description" content="Luxio — Aplikasi manajemen project & target untuk tim. Kelola target, divisi, dan progress dalam satu tempat." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://luxio.web.id/" />
    <title>Luxio - Project & Target Manager</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Luxio" />
    <meta property="og:title" content="Luxio - Project & Target Manager" />
    <meta property="og:description" content="Aplikasi manajemen project & target untuk tim. Kelola target, divisi, dan progress dalam satu tempat." />
    <meta property="og:url" content="https://luxio.web.id/" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:image" content="https://luxio.web.id/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luxio - Project & Target Manager" />
    <meta name="twitter:description" content="Aplikasi manajemen project & target untuk tim. Kelola target, divisi, dan progress dalam satu tempat." />
    <meta name="twitter:image" content="https://luxio.web.id/icon-512.png" />

    <!-- Structured data: WebSite + Organization (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Luxio",
          "url": "https://luxio.web.id/",
          "description": "Aplikasi manajemen project & target untuk tim."
        },
        {
          "@type": "Organization",
          "name": "Luxio",
          "url": "https://luxio.web.id/"
        }
      ]
    }
    </script>

    <script>
      try {
        var t = (function () {
          try { return JSON.parse(localStorage.getItem('luxio-store')).state.theme } catch (e) { return null }
        })()
        if (t === 'light') {
          document.documentElement.setAttribute('data-theme', 'light')
          document.documentElement.style.colorScheme = 'light'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FAFAFA')
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
